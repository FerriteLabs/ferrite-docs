# Triggered by ferrite-ops release orchestration to rebuild docs on new releases.
#
# This workflow:
#   1. Receives the new version from the dispatch payload
#   2. Rebuilds the documentation site
#   3. Deploys to GitHub Pages

name: Release Docs Update

on:
  repository_dispatch:
    types: [ferrite-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Ferrite version (e.g. 0.3.0)'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 Building docs for Ferrite v${VERSION}"

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: cd website && pnpm install --frozen-lockfile
      - run: cd website && pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        run: |
          echo "## Docs Updated for v${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed to: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
